name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    PYTHON_VERSION: "3.11"

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                    POSTGRES_DB: test_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest-cov

            - name: Create .env file
              run: |
                  cat << EOF > .env
                  DEBUG=True
                  SECRET_KEY=test-secret-key-for-ci
                  SESSION_SECRET_KEY=test-session-secret-key-for-ci
                  POSTGRES_USER=test_user
                  POSTGRES_PASSWORD=test_password
                  POSTGRES_SERVER=localhost
                  POSTGRES_PORT=5432
                  POSTGRES_DB=test_db
                  REDIS_HOST=localhost
                  REDIS_PORT=6379
                  EOF

            - name: Run database migrations
              run: |
                  alembic upgrade head

            - name: Run tests with coverage
              run: |
                  pytest --cov=app --cov-report=xml --cov-report=term-missing

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.xml
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install black flake8 mypy

            - name: Run Black (code formatter check)
              run: |
                  black --check app/ tests/

            - name: Run Flake8 (linting)
              run: |
                  flake8 app/ tests/ --max-line-length=120 --extend-ignore=E203,W503

            - name: Run MyPy (type checking)
              run: |
                  mypy app/ --ignore-missing-imports
              continue-on-error: true

    security:
        name: Security Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install safety
              run: pip install safety

            - name: Check for security vulnerabilities
              run: |
                  pip install -r requirements.txt
                  safety check --json
              continue-on-error: true

    build:
        name: Build Docker Image
        runs-on: ubuntu-latest
        needs: [test, lint]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              run: |
                  docker build -t b-boutique-backend:${{ github.sha }} .

            - name: Save Docker image
              run: |
                  docker save b-boutique-backend:${{ github.sha }} | gzip > image.tar.gz

            - name: Upload Docker image artifact
              uses: actions/upload-artifact@v4
              with:
                  name: docker-image
                  path: image.tar.gz
                  retention-days: 7
