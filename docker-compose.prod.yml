services:
  postgres:
    image: postgres:18-alpine
    container_name: b_boutique_postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-b_boutique}
      - POSTGRES_USER=${POSTGRES_USER:-bboutique}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bboutique_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b_boutique_network
  redis:
    image: redis:7-alpine
    container_name: b_boutique_redis
    restart: always
    command: redis-server
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - b_boutique_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: b_boutique_backend
    restart: always
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - uploads_data:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - b_boutique_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: b_boutique_celery_worker
    restart: always
    env_file:
      - .env.production
    depends_on:
      - redis
    command: celery -A app.worker.celery_app worker --loglevel=info
    networks:
      - b_boutique_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://benedettoboutique.com}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: b_boutique_frontend
    restart: always
    env_file:
      - ../frontend/.env.production
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://benedettoboutique.com}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - b_boutique_network

  nginx:
    image: nginx:alpine
    container_name: b_boutique_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - b_boutique_network
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot
    container_name: b_boutique_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  b_boutique_network:
    driver: bridge
